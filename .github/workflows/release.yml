name: Release archives
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify version and tag
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package_release.py
      - name: Publish reviewed tag assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt --verify-tag --title "PX4 FlightDeck $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
